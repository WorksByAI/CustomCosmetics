import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.lang.classfile.ClassFile
import java.lang.classfile.constantpool.Utf8Entry

def edition = providers.gradleProperty('client_edition').getOrElse('cheating')
if (!(edition in ['cheating', 'legit'])) throw new GradleException('client_edition must be cheating or legit')
tasks.named('jar', Jar) { archiveFileName = "CustomSkyBlock-${project.version}-${edition}.jar" }

if (edition == 'legit') {
    def cheatingMixins = 'customcosmetics-cheating.mixins.json'
    tasks.named('processResources', ProcessResources) {
        inputs.property('client_edition', edition)
        exclude cheatingMixins, 'assets/customcosmetics/gameplay/critter-textures.json',
            'assets/customcosmetics/gameplay/crystal-hollows-structures.json'
        doLast {
            File file = new File(destinationDir, 'fabric.mod.json')
            def metadata = new JsonSlurper().parse(file, 'UTF-8')
            metadata.custom['customcosmetics:edition'] = edition
            metadata.remove('jars')
            metadata.mixins.remove(cheatingMixins)
            metadata.entrypoints.keySet().removeIf { it.startsWith('csb-dungeon-') }
            metadata.depends.keySet().removeIf { it.startsWith('customskyblock-dungeon') || it == 'fabric-language-kotlin' }
            file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)), 'UTF-8')
        }
    }
    // Keep config data types to preserve saved settings when players switch editions.
    def sharedGameplay = ['BobbyIntegration', 'NaturalMotionBlurIntegration', 'LobbyMarker', 'MissingEnchants',
        'SeymourColors', 'TooltipTweaks', 'GameplayModule', 'GameplayKeybinds', 'WorldScannerSettings', 'AutoLeapPreset'] as Set
    tasks.named('jar', Jar) {
        exclude { entry ->
            String path = entry.path
            if (!path.endsWith('.class')) return false
            if (path.startsWith('com/customcosmetics/features/gameplay/')) {
                return !(path.tokenize('/').last().split(/[.$]/)[0] in sharedGameplay)
            }
            return ['gui/CheatingScreen', 'gui/GameplayHudEditor', 'mixin/GameplayMixin',
                'mixin/SecretChestMixin', 'mixin/RenderOptimiserMixin'].any { name ->
                String base = 'com/customcosmetics/' + name
                path == base + '.class' || path.startsWith(base + '$')
            }
        }
    }
    return
}

tasks.named('processResources', ProcessResources) { inputs.property('client_edition', edition) }

def dungeonVariants = ['26.1.2', '26.2', '26.3']
def dungeonDir = layout.buildDirectory.dir('dungeon')
def dungeonVersion = project.version.toString()
def dungeonBuilds = dungeonVariants.collectEntries { mc ->
    [(mc): file("src/quoi/versions/${mc}/build/libs/customskyblock-dungeon-${dungeonVersion}+${mc}.jar")]
}

def prepareDungeon = tasks.register('prepareDungeon') {
    dungeonVariants.each { mc ->
        dependsOn gradle.includedBuild('customskyblock-dungeon').task(":${mc}:jar")
    }
    inputs.files(dungeonBuilds.values())
    outputs.dir(dungeonDir)
    doLast {
        def jars = [:]
        def mixinConfigurations = [:]
        try {
            dungeonBuilds.each { mc, outputs -> jars[mc] = new java.util.zip.ZipFile(outputs) }
            def packaged = jars.collectEntries { mc, jar ->
                def metadata = { path -> jar.getInputStream(jar.getEntry(path)).withCloseable { new JsonSlurper().parse(it) } }
                def hooks = metadata('dungeon-mixins.json')
                def entrypoints = metadata('fabric.mod.json').entrypoints.values().flatten().collect { entry ->
                    entry.value.replace('.', '/') + '.class'
                }
                def classes = jar.entries().findAll { it.name.startsWith('quoi/') && it.name.endsWith('.class') }
                    .collectEntries { [(it.name): it] }
                def registered = classes.keySet().findAll { name ->
                    !name.contains('$') && (name.startsWith('quoi/mixins/accessors/') ||
                        hooks.any { hook -> name == "quoi/mixins/${hook}.class" })
                }
                def mixinConfig = metadata('mixins.quoi.json')
                mixinConfig.remove('plugin')
                mixinConfig.mixins = registered.sort().collect { it.substring('quoi/mixins/'.length(), it.length() - 6).replace('/', '.') }
                mixinConfigurations[mc] = JsonOutput.toJson(mixinConfig)
                def pending = new ArrayDeque<String>(entrypoints)
                pending.addAll(registered)
                def reachable = new HashSet<String>()
                def parser = ClassFile.of()
                while (!pending.isEmpty()) {
                    def path = pending.removeFirst()
                    def entry = classes[path]
                    if (entry == null || !reachable.add(path)) continue
                    def bytes = jar.getInputStream(entry).withCloseable { it.bytes }
                    // Descriptors, signatures, Kotlin metadata, and literal reflection names all use UTF-8 entries.
                    for (def constant : parser.parse(bytes).constantPool()) {
                        if (!(constant instanceof Utf8Entry)) continue
                        def names = (constant.stringValue() =~ /quoi[\/.][\w$\/.]+/)
                        while (names.find()) {
                            def dependency = names.group().replace('.', '/') + '.class'
                            if (classes.containsKey(dependency) && !reachable.contains(dependency)) pending.add(dependency)
                        }
                    }
                }
                // Omit assets from the unregistered Quoi mining and cat modules.
                def paths = jar.entries().findAll { entry ->
                    !entry.directory && !(entry.name in ['mixins.quoi.json', 'dungeon-mixins.json']) &&
                        entry.name != 'assets/quoi/ui/images/crystalhollowsmap.png' &&
                        entry.name != 'assets/quoi/glacite_tunnels_graph.json' &&
                        !entry.name.startsWith('assets/quoi/ui/fallingkittens/') &&
                        (!classes.containsKey(entry.name) || reachable.contains(entry.name))
                }
                    .collect { it.name }.toSet()
                logger.lifecycle("Dungeon ${mc}: retained ${reachable.size()} of ${classes.size()} classes")
                [(mc): paths]
            }
            def base = jars.values().first()
            def firstPaths = packaged.values().first()
            def common = new TreeSet(base.entries().findAll { entry ->
                firstPaths.contains(entry.name) && !entry.directory && (entry.name.startsWith('assets/quoi/') ||
                    (entry.name.startsWith('quoi/') && !entry.name.startsWith('quoi/mixins/'))) &&
                    jars.every { mc, other ->
                        def candidate = other.getEntry(entry.name)
                        packaged[mc].contains(entry.name) && candidate != null && candidate.size == entry.size && candidate.crc == entry.crc
                    }
            }.collect { it.name })

            File output = dungeonDir.get().asFile
            output.mkdirs()
            def write = { String jarName, java.util.zip.ZipFile source, Collection<String> paths, Map<String, String> generated ->
                file("${output}/${jarName}").withOutputStream { stream ->
                    new java.util.zip.ZipOutputStream(stream).withCloseable { zip ->
                        def add = { String name, Closure writeContents ->
                            def entry = new java.util.zip.ZipEntry(name)
                            entry.time = 0
                            zip.putNextEntry(entry)
                            writeContents(zip)
                            zip.closeEntry()
                        }
                        paths.sort().each { path ->
                            add(path) { sink -> source.getInputStream(source.getEntry(path)).withCloseable { it.transferTo(sink) } }
                        }
                        generated.each { name, content -> add(name) { it.write(content.getBytes('UTF-8')) } }
                    }
                }
            }
            // Keep mixin discovery, Kotlin metadata and Fabric access wideners in each selected variant.
            jars.each { mc, jar ->
                write("dungeon-${mc}.jar", jar, packaged[mc].findAll { !common.contains(it) },
                    ['mixins.quoi.json': mixinConfigurations[mc]])
            }
            write('dungeon-common.jar', base, common.toList(), ['fabric.mod.json': groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'customskyblock-dungeon-common', version: dungeonVersion,
                name: 'CustomSkyBlock Dungeon Common', environment: 'client', license: 'GPL-3.0-only'
            ])])
        } finally {
            jars.values().each { it.close() }
        }
    }
}

dependencies {
    implementation 'net.fabricmc:fabric-language-kotlin:1.14.2+kotlin.2.4.21'
}

jar {
    from(prepareDungeon) { into 'META-INF/dungeon' }
}

tasks.named('runClientGameTest') {
    dependsOn prepareDungeon
    doFirst {
        def variant = project.minecraft_version.startsWith('26.1') ? '26.1.2' : project.minecraft_version
        systemProperty 'fabric.addMods', files("build/dungeon/dungeon-${variant}.jar", 'build/dungeon/dungeon-common.jar').asPath
    }
}

tasks.named('sourcesJar', Jar) {
    from('src/quoi') {
        include 'src/main/**', 'LICENSE', '*.kts', 'gradle.properties', 'versions/*/gradle.properties'
        into 'src/quoi'
    }
}
