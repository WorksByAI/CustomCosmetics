plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-26.1-26.3"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://repo.hypixel.net/repository/Hypixel/' }
}

dependencies {
    if(providers.gradleProperty('sodium_test_jar').isPresent())testRuntimeOnly files(providers.gradleProperty('sodium_test_jar').get())
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly('com.terraformersmc:modmenu:20.0.1') {
        exclude group: 'net.fabricmc.fabric-api'
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.hypixel:mod-api:1.0.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'customcosmetics.sodiumTestRequired', providers.gradleProperty('sodium_test_jar').isPresent()
    dependsOn tasks.named('jar'), tasks.named('sourcesJar'), 'fullSourceZip'
    inputs.files(tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('fullSourceZip'))
    inputs.files('LICENSE', 'NOTICE', 'README.md', 'LICENSES', 'gradle/wrapper')
    systemProperty 'customcosmetics.projectDir', projectDir.absolutePath
    systemProperty 'customcosmetics.version', project.version.toString()
    systemProperty 'customcosmetics.binaryJar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'customcosmetics.sourcesJar', tasks.named('sourcesJar', Jar).get().archiveFile.get().asFile.absolutePath
    systemProperty 'customcosmetics.fullSourceZip', layout.buildDirectory.file("distributions/CustomCosmetics-${version}-full-source.zip").get().asFile.absolutePath
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: project.minecraft_version,
        loader_version: project.loader_version,
        fabric_api_version: project.fabric_api_version
    ]
    inputs.properties properties
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'customcosmetics-test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
        username = 'BlockingTest'
    }
}

loom.runs.named('clientGameTest') {
    runDir(providers.gradleProperty('nickname_run_dir').getOrElse("build/run/clientGameTest-${project.minecraft_version}"))
    vmArg "-Dcustomcosmetics.testProjectDir=${projectDir.absolutePath}"
    vmArg "-Dcustomcosmetics.itemAppearanceOnly=${providers.gradleProperty('appearance_game_only').getOrElse('false')}"
    vmArg "-Dcustomcosmetics.itemModelCatharsisTest=${providers.gradleProperty('appearance_catharsis_test').getOrElse('false')}"
    vmArg "-Dcustomcosmetics.nicknameOnly=${providers.gradleProperty('nickname_game_only').getOrElse('false')}"
    vmArg "-Dcustomcosmetics.nicknameAnimation=${providers.gradleProperty('nickname_capture_animation').getOrElse('false')}"
}

if(providers.gradleProperty('sodium_test_jar').isPresent()&&providers.gradleProperty('sodium_game_test').getOrElse('false').toBoolean()){
    dependencies {gametestRuntimeOnly files(providers.gradleProperty('sodium_test_jar').get())}
}

